<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name · Researcher</title>
<meta name="description" content="Personal academic website of Your Name — research, projects, publications, and working groups.">
<link rel="icon" type="image/png" href="images/logo/vitaterra-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================= THEME — change --accent to restyle everything ================= */
  :root {
    --bg: #f4f7f9; --surface: #ffffff; --text: #14283a; --muted: #56697a;
    --line: #dde5ec; --accent: #1b6a96; --accent-soft: #e1eef6;
    --shadow: 0 1px 2px rgba(31,42,36,.05), 0 10px 30px rgba(31,42,36,.08);
    --radius: 16px; --max: 1120px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1620; --surface: #15222f; --text: #e4edf4; --muted: #94a8b8;
      --line: #24384a; --accent: #6cbbe6; --accent-soft: #17344a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1620; --surface: #15222f; --text: #e4edf4; --muted: #94a8b8;
    --line: #24384a; --accent: #6cbbe6; --accent-soft: #17344a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; font-weight: 600; line-height: 1.2; margin: 0 0 .5em; }
  h2 { font-size: 2.1rem; }
  h3 { font-size: 1.2rem; }
  p { margin: 0 0 1em; }
  img { display: block; max-width: 100%; }
  .wrap { max-width: var(--max); margin: 0 auto; padding-left: 20px; padding-right: 20px; }
  .lead { color: var(--muted); font-size: 1.08rem; max-width: 680px; margin-bottom: 36px; }
  .meta { color: var(--muted); font-size: .88rem; }
  .tag { display: inline-block; font-size: .75rem; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin: 0 6px 6px 0; }
  .kicker { font-size: .75rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }

  /* Every photo sits in a .ph frame; a soft gradient shows while it loads or if the file is missing */
  .ph { position: relative; overflow: hidden; background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--accent) 30%, var(--accent-soft))); }
  .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
  [data-zoom] { cursor: zoom-in; }

  /* ================= NAV ================= */
  header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .nav { display: flex; align-items: center; gap: 16px; height: 64px; }
  .brand { font-family: "Fraunces", serif; font-size: 1.2rem; font-weight: 600; color: var(--text); white-space: nowrap; }
  .brand:hover { text-decoration: none; }
  .tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { padding: 8px 12px; border-radius: 999px; color: var(--muted); font-size: .92rem; font-weight: 500; white-space: nowrap; transition: .15s; }
  .tabs a:hover { color: var(--text); background: var(--accent-soft); text-decoration: none; }
  .tabs a.active { color: var(--accent); background: var(--accent-soft); }
  .theme-btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; flex-shrink: 0; display: grid; place-items: center; }
  @media (max-width: 760px) {
    .nav { flex-wrap: wrap; height: auto; padding-top: 12px; padding-bottom: 8px; }
    .tabs { order: 3; width: 100%; margin-left: 0; }
    .theme-btn { margin-left: auto; }
  }

  main { padding-top: 32px; padding-bottom: 80px; min-height: 70vh; }
  main > section { display: none; animation: fade .4s ease; }
  main > section.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .block { margin-top: 64px; }
  .block-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 20px; }
  .block-head h2 { margin: 0; font-size: 1.6rem; }

  /* ================= ABOUT ================= */
  .hero { height: min(62vh, 560px); min-height: 340px; border-radius: 22px; box-shadow: var(--shadow); }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.6)); pointer-events: none; }
  .hero-text { position: absolute; left: 0; right: 0; bottom: 0; padding: 36px 40px 36px 328px; color: #fff; z-index: 1; }
  .hero-text h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 6px; text-shadow: 0 2px 20px rgba(0,0,0,.3); }
  .hero-text p { margin: 0; opacity: .92; font-size: 1.05rem; }
  .hero-caption { position: absolute; top: 16px; right: 16px; z-index: 1; font-size: .75rem; color: #fff; background: rgba(0,0,0,.35); padding: 4px 10px; border-radius: 999px; backdrop-filter: blur(4px); }

  .intro { display: grid; grid-template-columns: 240px 1fr; gap: 48px; margin-top: -70px; position: relative; z-index: 2; padding: 0 40px; }
  .avatar { width: 200px; height: 200px; border-radius: 50%; border: 6px solid var(--bg); box-shadow: var(--shadow); }
  .profile-meta { margin-top: 16px; }
  .profile-meta strong { display: block; font-family: "Fraunces", serif; font-size: 1.25rem; font-weight: 600; }
  .socials { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .socials a { font-size: .8rem; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); background: var(--surface); }
  .socials a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  .bio { padding-top: 90px; font-size: 1.05rem; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
  .facts .card { padding: 20px 22px; }
  .facts ul { margin: 0; padding-left: 18px; }

  .org-logo { display: block; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-top: 16px; max-width: 220px; }
  .org-logo img { width: 100%; height: auto; }
  .contact .org-logo { margin: 4px 0 8px; }
  /* Masonry photo gallery */
  .gallery { columns: 3 260px; column-gap: 14px; }
  .gallery figure { margin: 0 0 14px; break-inside: avoid; border-radius: 14px; overflow: hidden; position: relative; box-shadow: var(--shadow); }
  .gallery figure:hover img { transform: scale(1.04); }
  .gallery figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 14px 12px; color: #fff; font-size: .85rem; background: linear-gradient(transparent, rgba(0,0,0,.6)); opacity: 0; transition: .25s; }
  .gallery figure:hover figcaption { opacity: 1; }
  @media (hover: none) { .gallery figcaption { opacity: 1; } }

  /* News cards */
  .news { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .news .ph { aspect-ratio: 16/10; }
  .news .body { padding: 18px 20px 22px; }
  .news .card:hover img { transform: scale(1.04); }

  @media (max-width: 820px) {
    .intro { grid-template-columns: 1fr; gap: 0; padding: 0 12px; margin-top: -60px; }
    .avatar { width: 140px; height: 140px; }
    .bio { padding-top: 20px; }
    .facts { grid-template-columns: 1fr; }
    .hero-text { padding: 24px 24px 76px; }
  }

  /* ================= RESEARCH (zig-zag photo rows) ================= */
  .theme { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: center; margin-bottom: 72px; }
  .theme.flip .theme-media { order: 2; }
  .theme-media { position: relative; }
  .theme-media .main { aspect-ratio: 4/3; border-radius: 20px; box-shadow: var(--shadow); }
  .theme-media .inset { position: absolute; width: 38%; aspect-ratio: 1; right: -18px; bottom: -24px; border-radius: 16px; border: 5px solid var(--bg); box-shadow: var(--shadow); }
  .theme.flip .inset { right: auto; left: -18px; }
  .theme-nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin: -8px 0 56px; }
  .theme-nav button { display: flex; flex-direction: column; justify-content: flex-start; text-align: left; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-weight: 500; font-size: .92rem; cursor: pointer; transition: .15s; }
  .theme-nav button:hover { border-color: var(--accent); color: var(--accent); }
  .theme-nav span { display: block; font-family: "Fraunces", serif; font-size: 1.3rem; color: var(--accent); margin-bottom: 2px; }
  .theme { scroll-margin-top: 90px; margin-bottom: 32px; }
  .theme-title { font-size: 1.55rem; }
  .theme-detail { padding: 28px 30px; margin-bottom: 40px; }
  .points { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 36px; margin-top: 8px; }
  .points h4 { font-size: .98rem; font-weight: 600; margin: 12px 0 4px; }
  .points p { margin: 0; color: var(--muted); font-size: .95rem; }
  .closing { margin: 22px 0 0; padding-top: 18px; border-top: 1px solid var(--line); font-size: .98rem; }
  .figure { margin: 0 0 80px; }
  @media (max-width: 760px) { .points { grid-template-columns: 1fr; } .theme-detail { padding: 22px; } }
  .theme .num { font-family: "Fraunces", serif; font-size: 3rem; color: var(--accent); line-height: 1; opacity: .5; }
  .theme-media:hover .main img { transform: scale(1.03); }
  @media (max-width: 820px) {
    .theme { grid-template-columns: 1fr; gap: 28px; }
    .theme.flip .theme-media { order: 0; }
    .theme-media .inset { right: 10px; } .theme.flip .inset { left: 10px; }
  }

  .figure { padding: 20px; }
  .figure .ph { background: #fff; border-radius: 10px; }
  .figure .ph img { object-fit: contain; height: auto; max-height: 760px; margin: 0 auto; width: auto; max-width: 100%; }
  .figure figcaption { font-size: .88rem; color: var(--muted); margin-top: 12px; }
  .figure figcaption b { color: var(--text); }
  .pub .ph.fig { background: #fff; }

  /* ================= PROJECTS ================= */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; font: inherit; font-size: .88rem; }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
  .project { display: flex; flex-direction: column; transition: transform .25s; }
  .project:hover { transform: translateY(-4px); }
  .project:hover .ph img { transform: scale(1.05); }
  .project .ph { aspect-ratio: 16/10; }
  .project .body { padding: 20px 22px 22px; display: flex; flex-direction: column; flex: 1; }
  .project .links { margin-top: auto; padding-top: 14px; display: flex; gap: 16px; font-size: .9rem; font-weight: 500; }
  .project .badge { position: absolute; top: 12px; left: 12px; z-index: 1; background: rgba(255,255,255,.92); color: #1f2a24; font-size: .72rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .project.featured { grid-column: 1 / -1; display: grid; grid-template-columns: 1.3fr 1fr; }
  .project.featured .ph { aspect-ratio: auto; min-height: 340px; }
  .project.featured .body { padding: 36px; justify-content: center; }
  .project.featured h3 { font-size: 1.7rem; }
  .project.featured .links { margin-top: 8px; }
  .project .ph.fig { background: #fff; }
  .project .ph.fig img { object-fit: contain; }
  .project.side { overflow: clip; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); align-items: start; }
  .project.side > .ph { aspect-ratio: auto; min-height: 0; padding: 16px; position: sticky; top: 80px; }
  .project.side .ph img { height: auto; }
  .project.side .body { padding: 30px 32px 30px 12px; }
  .project.side .body > p.meta { font-size: .95rem; line-height: 1.7; color: var(--text); }
  .project.side:hover, .project.side:hover .ph img { transform: none; }
  .project.side > .ph > .badge { top: 24px; left: 24px; }
  .extra { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .extra .ph { min-height: 0 !important; aspect-ratio: 1 !important; flex: 0 0 84px; width: 84px; height: 84px; border-radius: 10px; border: 1px solid var(--line); padding: 0 !important; }
  .extra .ph img { object-fit: cover; height: 100% !important; }
  .project.wide { grid-template-columns: 1fr; }
  .project.wide .ph { aspect-ratio: auto; min-height: 0; padding: 16px 16px 0; }
  .project.wide .ph img { height: auto; max-height: 560px; }
  .project.wide .body { padding: 28px 36px 32px; }
  .project.wide .body > p.meta { font-size: .98rem; line-height: 1.7; color: var(--text); max-width: 900px; }
  .project.wide:hover { transform: none; }
  .project.wide:hover .ph img { transform: none; }
  .subtitle { color: var(--muted); margin: -4px 0 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stats div { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
  .stats b { display: block; font-family: "Fraunces", serif; font-size: 1.35rem; color: var(--accent); line-height: 1.2; }
  .stats span { font-size: .78rem; color: var(--muted); }
  .project.wide .body > p.fig-cap { font-size: .85rem; margin-top: 14px; color: var(--muted); }
  @media (max-width: 820px) { .project.side { grid-template-columns: 1fr; } .project.side .body { padding: 22px; } .stats { grid-template-columns: 1fr 1fr; } .project.wide .body { padding: 22px; } .project.featured h3 { font-size: 1.3rem; } }
  @media (max-width: 820px) { .project.featured { grid-template-columns: 1fr; } .project.featured .ph { min-height: 220px; } }

  /* ================= PUBLICATIONS ================= */
  .pub-tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
  .pub-tools input { flex: 1; min-width: 200px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; }
  .year { font-family: "Fraunces", serif; font-size: 1.4rem; color: var(--muted); margin: 32px 0 10px; }
  .pub { display: grid; grid-template-columns: 120px 1fr; gap: 20px; padding: 18px; margin-bottom: 12px; align-items: start; }
  .pub .ph { aspect-ratio: 1; border-radius: 10px; }
  .pub .ph:hover img { transform: scale(1.06); }
  .pub-title { font-weight: 600; font-size: 1.02rem; line-height: 1.4; margin-bottom: 4px; }
  .pub .me { font-weight: 600; color: var(--text); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .pub .links { margin-top: 6px; }
  .pub .links a { font-size: .8rem; font-weight: 500; margin-right: 10px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; }
  .pub .links a:hover { border-color: var(--accent); text-decoration: none; }
  .pub.no-img { grid-template-columns: 1fr; }
  @media (max-width: 600px) { .pub { grid-template-columns: 80px 1fr; gap: 14px; padding: 14px; } }

  /* ================= WORKING GROUPS ================= */
  .wg { margin-bottom: 32px; }
  .wg .banner { aspect-ratio: 21/8; }
  .wg .banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.55)); }
  .wg .banner-text { position: absolute; left: 28px; right: 28px; bottom: 22px; z-index: 1; color: #fff; display: flex; justify-content: space-between; align-items: end; gap: 12px; }
  .wg .banner-text h3 { font-size: 1.7rem; margin: 0; }
  .wg .role { font-size: .75rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
  .status { font-size: .75rem; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.92); color: #1f2a24; white-space: nowrap; }
  .status.done { background: rgba(0,0,0,.45); color: #fff; }
  .wg .body { padding: 22px 28px 26px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; }
  .strip { display: flex; gap: 8px; }
  .strip .ph { width: 86px; height: 86px; border-radius: 10px; }
  .strip .ph:hover img { transform: scale(1.08); }
  @media (max-width: 760px) { .wg .banner { aspect-ratio: 16/9; } .wg .body { grid-template-columns: 1fr; } .wg .banner-text h3 { font-size: 1.3rem; } }

  /* ================= CONTACT ================= */
  .contact { display: grid; grid-template-columns: 1fr 1fr; }
  .contact .ph { min-height: 100%; }
  .contact .body { padding: 36px; }
  .contact dt { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-top: 18px; }
  .contact dd { margin: 2px 0 0; }
  form label { display: block; font-size: .85rem; font-weight: 500; margin: 12px 0 4px; }
  form input, form textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  form textarea { min-height: 110px; resize: vertical; }
  .btn { margin-top: 16px; padding: 10px 22px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  @media (max-width: 820px) { .contact { grid-template-columns: 1fr; } .contact .ph { min-height: 240px; } .contact .body { padding: 24px; } }

  .project[data-open] { cursor: pointer; }
  .project[data-open]:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .project .ph.cover-fig { background: #fff; }
  .project .ph.cover-fig img { object-fit: contain; padding: 30px 10px 6px; }
  .project .more { color: var(--accent); font-weight: 600; }

  /* ================= PROJECT POP-UP ================= */
  .modal { position: fixed; inset: 0; z-index: 90; background: rgba(8,16,24,.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 24px; }
  .modal.open { display: flex; animation: fade .25s ease; }
  .modal-panel { position: relative; background: var(--surface); border-radius: 20px; width: min(980px, 100%); max-height: calc(100vh - 48px); overflow-y: auto; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  .modal-close { position: sticky; top: 14px; float: right; margin: 14px 14px 0 0; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 22px; cursor: pointer; }
  .modal-fig { background: #fff; padding: 24px 24px 8px; border-bottom: 1px solid var(--line); }
  .modal-fig img { max-height: 60vh; width: auto; max-width: 100%; margin: 0 auto; cursor: zoom-in; }
  .modal-text { padding: 28px 36px 34px; }
  .modal-text h2 { font-size: 1.6rem; margin-bottom: 6px; }
  .modal-text h4 { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
  .modal-text .abstract { font-size: 1rem; line-height: 1.75; }
  .modal-text .fig-cap { font-size: .85rem; margin-top: 16px; }
  .modal-text .links { margin-top: 18px; display: flex; gap: 16px; font-weight: 600; }
  .modal .extra .ph { width: 84px; height: 84px; flex: 0 0 84px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  @media (max-width: 700px) { .modal { padding: 0; } .modal-panel { border-radius: 0; max-height: 100vh; height: 100%; } .modal-text { padding: 22px; } .modal-fig { padding: 16px 12px 6px; } }

  /* ================= LIGHTBOX ================= */
  .lb { position: fixed; inset: 0; z-index: 100; background: rgba(8,12,10,.92); display: none; align-items: center; justify-content: center; flex-direction: column; padding: 24px; }
  .lb.open { display: flex; }
  .lb img { max-width: min(1200px, 92vw); max-height: 80vh; border-radius: 10px; object-fit: contain; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .lb p { color: #e6ebe7; margin: 14px 0 0; font-size: .95rem; text-align: center; max-width: 700px; }
  .lb button { position: absolute; background: rgba(255,255,255,.12); color: #fff; border: 0; width: 46px; height: 46px; border-radius: 50%; font-size: 22px; cursor: pointer; }
  .lb button:hover { background: rgba(255,255,255,.25); }
  .lb .x { top: 18px; right: 18px; } .lb .prev { left: 18px; } .lb .next { right: 18px; }

  footer { border-top: 1px solid var(--line); padding: 28px 0; color: var(--muted); font-size: .85rem; text-align: center; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap nav">
    <a href="#about" class="brand" id="brand">Your Name</a>
    <nav class="tabs" aria-label="Sections">
      <a href="#about">About</a>
      <a href="#research">Research</a>
      <a href="#projects">Projects</a>
      <a href="#publications">Publications</a>

/* ===================== Rendering — no need to edit below ===================== */
const $ = s => document.querySelector(s);
const pic = (src, alt = "", cls = "", group = "", caption = "", full = "") =>
  `<div class="ph ${cls}"><img src="${src}" alt="${alt}" loading="lazy" data-zoom data-group="${group}" data-caption="${caption || alt}" ${full ? `data-full="${full}"` : ""} onerror="this.remove()"></div>`;
const links = obj => Object.entries(obj || {}).map(([k, v]) => `<a href="${v}">${k}</a>`).join("");

function renderAbout() {
  const s = SITE;
  $("#tab-about").innerHTML = `
    <div class="ph hero"><img src="${s.heroImage}" alt="${s.heroCaption}" data-zoom data-group="hero" data-caption="${s.heroCaption}" onerror="this.remove()">
      ${s.heroCaption ? `<span class="hero-caption">${s.heroCaption}</span>` : ""}
      <div class="hero-text"><h1>${s.name}</h1><p>${s.tagline}</p></div>
    </div>
    <div class="intro">
      <aside>
        ${pic(s.profileImage, s.name, "avatar", "profile")}
        <div class="profile-meta"><strong>${s.name}</strong><span class="meta">${s.title}<br>${s.affiliation}</span></div>
        ${s.orgLogo ? `<${s.orgUrl ? `a href="${s.orgUrl}"` : "div"} class="org-logo"><img src="${s.orgLogo}" alt="${s.affiliation}"></${s.orgUrl ? "a" : "div"}>` : ""}
        <div class="socials">${links(s.socials)}</div>
      </aside>
      <div class="bio">
        ${s.bio.map(p => `<p>${p}</p>`).join("")}
      </div>
    </div>

`;
}

    <div class="theme-nav">${r.themes.map((t, i) => `<button data-go="theme-${i}"><span>${String(i + 1).padStart(2, "0")}</span>${t.short}</button>`).join("")}</div>

    document.getElementById(b.dataset.go).scrollIntoView({ behavior: "smooth", block: "start" }));

function renderProjects() {

      </article>`).join("")}</div>`;
  document.querySelectorAll("#tab-projects .chip").forEach(c => c.onclick = () => {
    document.querySelectorAll("#tab-projects .chip").forEach(x => x.classList.toggle("on", x === c));

  });

}

function openProject(p) {
  const m = $("#modal");
  m.querySelector(".modal-body").innerHTML = `
    ${p.img ? `<div class="modal-fig"><img src="${p.img}" alt="${p.title}" data-zoom data-group="modal" data-caption="${p.caption || p.title}"></div>` : ""}
    <div class="modal-text">
      ${p.badge ? `<div class="kicker">${p.badge}</div>` : ""}
      <h2>${p.title}</h2>${p.subtitle ? `<div class="subtitle">${p.subtitle}</div>` : ""}
      ${p.stats ? `<div class="stats">${p.stats.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>` : ""}
      <h4>${p.textLabel || "Abstract"}</h4><p class="abstract">${p.text}</p>
      ${p.tags ? `<div>${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>` : ""}
      ${p.caption ? `<p class="meta fig-cap">Figure: ${p.caption}</p>` : ""}
      ${p.extra ? `<div class="extra">${p.extra.map(x => `<div class="ph"><img src="${x.thumb || x.img}" alt="${x.caption}" data-zoom data-group="modal" data-caption="${x.caption}" data-full="${x.img}" onerror="this.remove()"></div>`).join("")}<span class="meta">More figures — click to enlarge</span></div>` : ""}
      <div class="links">${links(p.links)}</div>
    </div>`;
  m.classList.add("open"); document.body.style.overflow = "hidden";
  m.querySelector(".modal-panel").scrollTop = 0; m.querySelector(".modal-close").focus();
}
function closeProject() { $("#modal").classList.remove("open"); document.body.style.overflow = ""; }

function renderPublications() {
  const LABEL = { working: "Working papers", journal: "Journal", preprint: "Preprint", conference: "Conference", data: "Data" };
  const TAG = { working: "working paper" };
  const nPub = SITE.publications.filter(p => p.type !== "working").length, nWork = SITE.publications.length - nPub;
  $("#tab-publications").innerHTML = `<h2>Publications</h2>
    <p class="lead">${nPub} publications${nWork ? ` and ${nWork} working papers` : ""} · full list on <a href="${SITE.socials["Google Scholar"]}">Google Scholar</a>.</p>
    <div class="pub-tools"><input id="pubSearch" type="search" placeholder="Search title, author, journal…">
      ${["all", ...Object.keys(LABEL).filter(t => SITE.publications.some(p => p.type === t))].map((t, i) => `<button class="chip ${i ? "" : "on"}" data-type="${t}">${t === "all" ? "All" : LABEL[t]}</button>`).join("")}</div>
    <div id="pubList"></div>`;
  let filter = "all";
  const card = p => `<div class="card pub ${p.img ? "" : "no-img"}">${p.img ? pic(p.img, p.title, "fig", "pubs", p.title, p.full) : ""}
        <div><div class="pub-title">${p.title}</div><div class="meta">${p.authors.split(SITE.me).join(`<span class="me">${SITE.me}</span>`)}</div>
        <div class="meta"><em>${p.venue}</em> <span class="tag" style="margin-left:6px">${TAG[p.type] || p.type}</span>${p.cites ? `<span class="meta" style="margin-left:4px">Cited by ${p.cites}</span>` : ""}</div>
        <div class="links">${p.project != null ? `<a href="#" data-proj="${p.project}">Abstract</a>` : ""}${links(p.type === "working" ? p.links : { ...p.links, "Google Scholar": "https://scholar.google.com/scholar?q=" + encodeURIComponent('"' + p.title + '"') })}</div></div></div>`;
  const draw = () => {
    const q = $("#pubSearch").value.toLowerCase();
    const shown = SITE.publications.filter(p => (filter === "all" || p.type === filter) && [p.title, p.authors, p.venue].join(" ").toLowerCase().includes(q));
    const work = shown.filter(p => p.type === "working"), pubs = shown.filter(p => p.type !== "working").sort((a, b) => b.year - a.year);
    let html = work.length ? `<div class="year">Working papers</div>` + work.map(card).join("") : "", yr = null;
    pubs.forEach(p => { if (p.year !== yr) { yr = p.year; html += `<div class="year">${yr}</div>`; } html += card(p); });
    $("#pubList").innerHTML = html || `<p class="meta">No matches.</p>`;
    document.querySelectorAll("#pubList [data-proj]").forEach(a => a.onclick = e => { e.preventDefault(); openProject(SITE.projects[a.dataset.proj]); });
  };
  $("#pubSearch").oninput = draw;
  document.querySelectorAll("#tab-publications .chip").forEach(c => c.onclick = () => {
    document.querySelectorAll("#tab-publications .chip").forEach(x => x.classList.toggle("on", x === c));
    filter = c.dataset.type; draw();
  });
  draw();
}

/* Tabs (hash-based, so yoursite/#publications links work) */
function showTab() {
  if (document.getElementById("modal")?.classList.contains("open")) closeProject();
  const id = (location.hash || "#about").slice(1);
  const t = document.getElementById("tab-" + id) ? id : "about";
  document.querySelectorAll("main > section").forEach(s => s.classList.toggle("active", s.id === "tab-" + t));
  document.querySelectorAll(".tabs a").forEach(a => a.classList.toggle("active", a.hash === "#" + t));
  window.scrollTo(0, 0);
  document.querySelector(".tabs a.active")?.scrollIntoView({ inline: "center", block: "nearest" });
}
addEventListener("hashchange", showTab); showTab();

/* Lightbox: click any photo; arrows/keys move within the same group */
const lb = $("#lb"), lbImg = lb.querySelector("img"), lbCap = lb.querySelector("p");
let set = [], idx = 0;
const show = () => { lbImg.src = set[idx].dataset.full || set[idx].src; lbCap.textContent = set[idx].dataset.caption || ""; lb.querySelector(".prev").style.display = lb.querySelector(".next").style.display = set.length > 1 ? "" : "none"; };
document.addEventListener("click", e => {
  const im = e.target.closest("img[data-zoom]"); if (!im) return;
  const scope = im.closest(".modal") || document.querySelector("main > section.active");
  set = [...scope.querySelectorAll(`img[data-zoom][data-group="${im.dataset.group}"]`)];
  idx = Math.max(0, set.indexOf(im)); show(); lb.classList.add("open");
});
const step = d => { idx = (idx + d + set.length) % set.length; show(); };
lb.querySelector(".x").onclick = () => lb.classList.remove("open");
lb.querySelector(".prev").onclick = () => step(-1);
lb.querySelector(".next").onclick = () => step(1);
lb.onclick = e => { if (e.target === lb) lb.classList.remove("open"); };
$("#modal .modal-close").onclick = closeProject;
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeProject(); });
addEventListener("keydown", e => { if (e.key === "Escape" && !lb.classList.contains("open") && $("#modal").classList.contains("open")) closeProject(); });
addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") lb.classList.remove("open");
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

/* Dark-mode toggle */
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("#themeBtn").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
};
